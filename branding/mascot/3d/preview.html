<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GROOWIE 3D Preview</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4/dist/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #2563eb; font-family: Outfit, sans-serif; }
    h1 { position: fixed; top: 24px; width: 100%; margin: 0; text-align: center;
         color: #fde047; font-size: 56px; font-weight: 800; letter-spacing: 1px; pointer-events: none; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
    nav { position: fixed; bottom: 56px; width: 100%; display: flex; justify-content: center;
          flex-wrap: wrap; gap: 10px; padding: 0 16px; box-sizing: border-box; }
    button { font: 600 16px Outfit, sans-serif; color: #fff; background: rgba(255,255,255,.14);
             border: 2px solid rgba(255,255,255,.35); border-radius: 999px; padding: 10px 20px; cursor: pointer; }
    button[aria-pressed="true"] { background: #fde047; border-color: #fde047; color: #1e3a8a; }
    p { position: fixed; bottom: 20px; width: 100%; margin: 0; text-align: center;
        color: #fff; opacity: .8; font-weight: 600; pointer-events: none; }
  </style>
</head>
<body>
  <h1>GROOWIE</h1>
  <model-viewer id="groowie" src="groowie.glb" alt="GROOWIE, the Growthscope mascot"
    camera-controls autoplay animation-name="Idle"
    shadow-intensity="1" shadow-softness="0.8" exposure="1.05"
    camera-orbit="-25deg 78deg auto" tone-mapping="neutral"></model-viewer>
  <nav>
    <button data-anim="Idle" aria-pressed="true">Idle</button>
    <button data-anim="Walk" aria-pressed="false">Walk</button>
    <button data-anim="Wave" aria-pressed="false">Wave</button>
    <button data-anim="ThumbsUp" aria-pressed="false">Thumbs up</button>
    <button data-anim="" aria-pressed="false">Rest pose</button>
  </nav>
  <p>Drag to rotate · scroll to zoom</p>
  <script>
    const viewer = document.getElementById("groowie");
    const buttons = document.querySelectorAll("nav button");
    buttons.forEach((btn) => btn.addEventListener("click", () => {
      buttons.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      if (btn.dataset.anim) {
        viewer.animationName = btn.dataset.anim;
        viewer.currentTime = 0;
        viewer.play();
      } else {
        viewer.pause();
        viewer.animationName = null;
        viewer.currentTime = 0;
      }
    }));
  </script>
</body>
</html>
